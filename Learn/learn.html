<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="learn.css";>
    <title>Learn</title>
    <script src="learn.js"></script>
</head>
<body>
    <page id="page">
        <div id="top-bar">
            <div id="title-container">
            <h1 id="title">PlaygroundMLP</h1>
            </div>
            <div id="navigate-button">
                <button id="dashboard" onclick="window.location.href='../Dashboard/dashboard.html'">Dashboard</button>
            </div>
        </div>
        <div id="midsection">
            <button class="unclicked-button" data-id="1" onclick="openPopup(1)">What Is A Multilayer Perceptron?</button>
            <button class="unclicked-button" data-id="2" onclick="openPopup(2)">Hidden Layers</button>
            <button class="unclicked-button" data-id="3" onclick="openPopup(3)">Nodes Per Layer</button>
            <button class="unclicked-button" data-id="4" onclick="openPopup(4)">Learning Rate</button>
            <button class="unclicked-button" data-id="5" onclick="openPopup(5)">Batch Size</button>
            <button class="unclicked-button" data-id="6" onclick="openPopup(6)">Epochs</button>
            <button class="unclicked-button" data-id="7" onclick="openPopup(7)">Weight Initialization</button>
            <button class="unclicked-button" data-id="8" onclick="openPopup(8)">Bias Initialization</button>
        </div>

        <div id="popup-overlay" onclick="closePopup()">
            <div id="popup" onclick="event.stopPropagation()">
                <h2 id="popup-title"></h2>
                <div id="popup-body"></div>
                <button id="popup-close" onclick="closePopup()">Close</button>
            </div>
        </div>

    </page>

</body>
</html>
