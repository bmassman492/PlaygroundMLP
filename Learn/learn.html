<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="learn.css";>
    <title>Learn</title>
    <script src="learn.js"></script>
</head>
<body>
    <page id="page">
        <div id="top-bar">
            <div id="title-container">
            <h1 id="title">PlaygroundMLP</h1>
            </div>
            <div id="navigate-button">
                <button id="dashboard" onclick="window.location.href='../Dashboard/dashboard.html'">Dashboard</button>
            </div>
        </div>
        <div id="midsection">
            <button class="unclicked-button" onclick="openPopup(1)">1</button>
            <button class="unclicked-button" onclick="openPopup(2)">2</button>
            <button class="unclicked-button" onclick="openPopup(3)">3</button>
            <button class="unclicked-button" onclick="openPopup(4)">4</button>
            <button class="unclicked-button" onclick="openPopup(5)">5</button>
            <button class="unclicked-button" onclick="openPopup(6)">6</button>
            <button class="unclicked-button" onclick="openPopup(7)">7</button>
            <button class="unclicked-button" onclick="openPopup(8)">8</button>
        </div>

        <div id="popup-overlay" onclick="closePopup()">
            <div id="popup" onclick="event.stopPropagation()">
                <h2 id="popup-title"></h2>
                <p id="popup-body"></p>
                <button onclick="closePopup()">Close</button>
            </div>
        </div>

    </page>

</body>
</html>
